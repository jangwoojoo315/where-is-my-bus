<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>슬슬나가 - 설정</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>슬슬나가 설정</h1>

      <section class="card">
        <h2>1. 정류장 / 버스 추가</h2>
        <div class="field-row">
          <input id="stopName" type="text" placeholder="정류장 이름 (예: 수원역)" />
          <button id="searchStop" class="primary">검색</button>
        </div>
        <div id="searchStatus" class="status-msg"></div>
        <div id="stopResults" class="results"></div>

        <div id="routeArea" class="add-area" hidden>
          <div class="selected">정류장: <span id="selectedStop"></span></div>
          <div class="hint">등록할 버스 노선을 선택하세요.</div>
          <div id="routeStatus" class="status-msg"></div>
          <div id="routeResults" class="results"></div>
        </div>
      </section>

      <section class="card">
        <h2>2. 등록된 항목</h2>
        <div id="favList"></div>
      </section>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
